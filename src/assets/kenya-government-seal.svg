<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients for Lions and Accents -->
    <linearGradient id="lionGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#DC2626" />
      <stop offset="100%" stopColor="#991B1B" />
    </linearGradient>
    <linearGradient id="shieldGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#16A34A" />
      <stop offset="100%" stopColor="#14532D" />
    </linearGradient>
    <linearGradient id="bannerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="50%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- ── LEFT EMBLEM: COAT OF ARMS ── -->
    <g id="kenya-coat-of-arms" transform="translate(90, 85) scale(0.9)" filter="url(#sealShadow)">
      
      <!-- Crossed Traditional Maasai Spears -->
      <!-- Spear 1 (Left to Right) -->
      <line x1="-75" y1="85" x2="75" y2="-85" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
      <path d="M 65 -75 L 85 -95 L 75 -65 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1.5" />
      <circle cx="-75" cy="85" r="3" fill="#B45309" />

      <!-- Spear 2 (Right to Left) -->
      <line x1="75" y1="85" x2="-75" y2="-85" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
      <path d="M -65 -75 L -85 -95 L -75 -65 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1.5" />
      <circle cx="75" cy="85" r="3" fill="#B45309" />

      <!-- Green Agricultural Base / Mount -->
      <path d="M -80 62 Q 0 85 80 62 Q 60 78 0 82 Q -60 78 -80 62 Z" fill="#15803D" stroke="#166534" stroke-width="1.5" />
      <path d="M -60 66 Q -40 50 -20 68 Q 0 52 20 68 Q 40 50 60 66" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" />

      <!-- Left Supporter: Lion Holding Spear -->
      <g id="left-lion" fill="url(#lionGold)" stroke="#78350F" stroke-width="1.5" stroke-linejoin="round">
        <!-- Body & Hind leg -->
        <path d="M -38 25 C -55 15 -70 30 -62 55 C -65 58 -70 65 -60 65 C -55 65 -50 58 -46 50 C -42 42 -38 35 -38 25 Z" />
        <!-- Forelegs grasping spear -->
        <path d="M -48 10 C -60 0 -68 -15 -55 -25 C -50 -20 -45 -10 -40 -5 C -35 0 -38 10 -48 10 Z" />
        <path d="M -42 12 C -52 10 -60 2 -52 -8 C -48 -2 -42 5 -38 12 Z" />
        <!-- Lion Mane & Head facing outwards -->
        <path d="M -45 -15 C -55 -25 -52 -45 -35 -48 C -30 -50 -25 -42 -30 -35 C -25 -38 -20 -35 -22 -28 C -20 -20 -30 -15 -45 -15 Z" />
        <!-- Lion Tail -->
        <path d="M -60 55 C -80 40 -85 10 -72 -5 C -75 0 -78 12 -70 25 C -65 35 -60 48 -60 55 Z" />
        <circle cx="-73" cy="-6" r="4" fill="#B45309" />
      </g>

      <!-- Right Supporter: Lion Holding Spear -->
      <g id="right-lion" transform="scale(-1, 1)" fill="url(#lionGold)" stroke="#78350F" stroke-width="1.5" stroke-linejoin="round">
        <!-- Body & Hind leg -->
        <path d="M -38 25 C -55 15 -70 30 -62 55 C -65 58 -70 65 -60 65 C -55 65 -50 58 -46 50 C -42 42 -38 35 -38 25 Z" />
        <!-- Forelegs grasping spear -->
        <path d="M -48 10 C -60 0 -68 -15 -55 -25 C -50 -20 -45 -10 -40 -5 C -35 0 -38 10 -48 10 Z" />
        <path d="M -42 12 C -52 10 -60 2 -52 -8 C -48 -2 -42 5 -38 12 Z" />
        <!-- Lion Mane & Head -->
        <path d="M -45 -15 C -55 -25 -52 -45 -35 -48 C -30 -50 -25 -42 -30 -35 C -25 -38 -20 -35 -22 -28 C -20 -20 -30 -15 -45 -15 Z" />
        <!-- Lion Tail -->
        <path d="M -60 55 C -80 40 -85 10 -72 -5 C -75 0 -78 12 -70 25 C -65 35 -60 48 -60 55 Z" />
        <circle cx="-73" cy="-6" r="4" fill="#B45309" />
      </g>

      <!-- Central Maasai Warrior Shield -->
      <g id="maasai-shield">
        <!-- Shield Base Shape (Traditional Convex Oval) -->
        <clipPath id="shieldClip">
          <path d="M 0 -58 C 30 -35 34 25 0 65 C -34 25 -30 -35 0 -58 Z" />
        </clipPath>

        <g clip-path="url(#shieldClip)">
          <!-- Top Section: Black -->
          <rect x="-40" y="-60" width="80" height="38" fill="#111827" />
          <!-- White Divider Stripe 1 -->
          <rect x="-40" y="-22" width="80" height="4" fill="#FFFFFF" />
          <!-- Middle Section: Red -->
          <rect x="-40" y="-18" width="80" height="45" fill="url(#shieldRed)" />
          <!-- White Divider Stripe 2 -->
          <rect x="-40" y="27" width="80" height="4" fill="#FFFFFF" />
          <!-- Bottom Section: Green -->
          <rect x="-40" y="31" width="80" height="40" fill="url(#shieldGreen)" />

          <!-- White Traditional Cockerel Holding Axe (KANU / National Pioneer Symbol on Red Field) -->
          <g id="cockerel" transform="translate(0, 4) scale(0.65)" fill="#FFFFFF" stroke="#000000" stroke-width="0.7">
            <!-- Rooster body & tail feathers -->
            <path d="M 0 -12 C 6 -12 12 -6 10 4 C 8 10 2 12 -4 8 C -10 6 -12 0 -10 -8 C -8 -12 -4 -12 0 -12 Z" />
            <path d="M 8 0 C 18 -4 20 8 12 14 C 6 12 6 8 8 0 Z" />
            <path d="M 4 -8 C 14 -16 22 -6 16 2 Z" />
            <!-- Head, Comb & Beak -->
            <circle cx="-6" cy="-14" r="5" />
            <path d="M -6 -19 C -4 -22 -2 -19 -4 -17 C -2 -19 0 -17 -2 -15 Z" fill="#EF4444" />
            <path d="M -11 -14 L -16 -12 L -11 -10 Z" fill="#F59E0B" />
            <!-- Axe held in claw -->
            <line x1="-3" y1="6" x2="-14" y2="-4" stroke="#475569" stroke-width="2" />
            <path d="M -14 -8 L -18 -4 L -12 -2 Z" fill="#94A3B8" />
          </g>
        </g>

        <!-- Shield Outer Rim & Spine -->
        <path d="M 0 -58 C 30 -35 34 25 0 65 C -34 25 -30 -35 0 -58 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
        <path d="M 0 -58 C 30 -35 34 25 0 65 C -34 25 -30 -35 0 -58 Z" fill="none" stroke="#000000" stroke-width="1" />
        <line x1="0" y1="-58" x2="0" y2="65" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 2" />
      </g>

      <!-- Harambee National Motto Ribbon Banner -->
      <g id="motto-banner" transform="translate(0, 78)">
        <path d="M -65 0 Q 0 -8 65 0 L 60 16 Q 0 8 -60 16 Z" fill="url(#bannerGold)" stroke="#78350F" stroke-width="1.2" />
        <path d="M -65 0 L -75 8 L -60 16 L -65 0 Z" fill="#D97706" stroke="#78350F" stroke-width="1" />
        <path d="M 65 0 L 75 8 L 60 16 L 65 0 Z" fill="#D97706" stroke="#78350F" stroke-width="1" />
        <text x="0" y="11" font-family="'Arial Black', Impact, sans-serif" font-size="9" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="2">HARAMBEE</text>
      </g>
    </g>

    <!-- ── RIGHT TYPOGRAPHY: OFFICIAL GOVERNMENT IDENTIFICATION ── -->
    <g transform="translate(200, 52)">
      <!-- Republic of Kenya -->
      <text x="0" y="18" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#0F172A" letter-spacing="0.05em">
        REPUBLIC OF KENYA
      </text>

      <!-- Ministry of Education -->
      <text x="0" y="42" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" letter-spacing="0.02em">
        MINISTRY OF EDUCATION
      </text>

      <!-- CBC Competency-Based Curriculum Badge Pill -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="280" height="28" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <circle cx="14" cy="14" r="5" fill="#16A34A" />
        <text x="26" y="18" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1D4ED8" letter-spacing="0.06em">
          COMPETENCY-BASED CURRICULUM (CBC)
        </text>
      </g>

      <!-- Quality & Standards Stamp -->
      <text x="0" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.03em">
        State Department for Basic Education · Approved Institution
      </text>
    </g>
  </g>
</svg>
