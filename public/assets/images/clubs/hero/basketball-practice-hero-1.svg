<svg width="1920" height="1440" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1440" fill="#2e132e"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#5a2d7d;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#grad1)"/>
  
  <!-- Basketball Court -->
  <g opacity="0.3">
    <rect x="200" y="200" width="1520" height="1040" fill="none" stroke="#ffffff" stroke-width="4"/>
    <line x1="960" y1="200" x2="960" y2="1240" stroke="#ffffff" stroke-width="2"/>
    <circle cx="960" cy="720" r="300" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="960" cy="720" r="40" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Basketball players silhouettes -->
  <g opacity="0.4">
    <!-- Player 1 shooting -->
    <circle cx="400" cy="400" r="40" fill="#ffffff"/>
    <rect x="380" y="450" width="40" height="120" fill="#ffffff"/>
    <circle cx="370" cy="590" r="25" fill="#ffffff"/>
    <circle cx="430" cy="590" r="25" fill="#ffffff"/>
    
    <!-- Player 2 defending -->
    <circle cx="1400" cy="600" r="40" fill="#ffffff"/>
    <rect x="1380" y="650" width="40" height="120" fill="#ffffff"/>
    <circle cx="1370" cy="790" r="25" fill="#ffffff"/>
    <circle cx="1430" cy="790" r="25" fill="#ffffff"/>
  </g>
  
  <!-- Basketball -->
  <circle cx="800" cy="350" r="35" fill="#ff8c00" opacity="0.5"/>
  <line x1="800" y1="315" x2="800" y2="385" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="835" y1="350" x2="765" y2="350" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  
  <!-- Text -->
  <text x="960" y="1100" font-size="72" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="Arial">Basketball Practice</text>
  <text x="960" y="1180" font-size="32" text-anchor="middle" fill="#d946ef" font-family="Arial">Skill Development · Team Performance</text>
</svg>